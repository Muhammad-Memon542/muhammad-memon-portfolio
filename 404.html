<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0f2331" />
<meta name="robots" content="noindex" />
<title>Off the chart &mdash; Muhammad Memon</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#e4eef0; --muted:#9bb2ba; --signal:#f5c518; --signal-ink:#0f2a3a;
    --display:'Big Shoulders Display','Arial Narrow',sans-serif;
    --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;padding:32px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%,#283462 0%,#0f2331 55%,#060b22 100%);
    color:var(--ink);font-family:var(--body);line-height:1.5;
  }
  .wrap{max-width:46ch}
  svg{width:96px;height:96px;margin-bottom:8px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(64px,16vw,132px);line-height:.82;margin:0}
  p.lede{font-size:clamp(17px,2.4vw,21px);margin:14px 0 6px}
  p.sub{color:var(--muted);margin:0 0 30px}
  a.btn{
    display:inline-block;background:var(--signal);color:var(--signal-ink);text-decoration:none;
    font-weight:700;border-radius:999px;padding:13px 26px;
  }
  a.btn:hover{filter:brightness(1.06)}
  a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main class="wrap">
    <svg viewBox="0 0 64 64" role="img" aria-label="Lighthouse">
      <rect x="11" y="52" width="42" height="3" rx="1.5" fill="#4a6a3a"/>
      <path d="M21.5 52 L24 20 L40 20 L42.5 52 Z" fill="#f3ede1"/>
      <path d="M21.5 52 L22.3 42 L41.7 42 L42.5 52 Z" fill="#c72d3c"/>
      <path d="M23.2 31 L40.8 31 L41.4 41 L22.6 41 Z" fill="#c72d3c"/>
      <rect x="22.5" y="17.5" width="19" height="3" rx="1" fill="#141c26"/>
      <rect x="26" y="11" width="12" height="6.5" fill="#f5c518"/>
      <path d="M22.5 11 L41.5 11 L32 4 Z" fill="#c72d3c"/>
    </svg>
    <h1>404</h1>
    <p class="lede">You&rsquo;ve sailed off the edge of the chart.</p>
    <p class="sub">There&rsquo;s nothing out here but open water.</p>
    <a class="btn" href="/">Back to the harbor</a>
  </main>
</body>
</html>
