name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install: the check only uses Node's standard library.
      - run: npm run check
